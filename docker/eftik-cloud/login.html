<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fdf3ea">
<title>狐分身 · 工作台登录</title>
<style>
  /* ===== 主题变量：改这里即可换肤 =====
     配色呼应背景插画（日落暖橘 + 奶油白），保证与品牌一致。 */
  :root {
    --bg-image: none;                 /* 背景图由 web-ui.js 注入（/branding/bg 存在时） */
    --bg-fallback: linear-gradient(160deg, #fdf1e6 0%, #fbe6d8 45%, #f7ddd0 100%);
    --card-bg: rgba(255, 252, 249, 0.97);
    --card-border: rgba(255, 255, 255, 0.95);
    --card-shadow: 0 28px 64px rgba(140, 82, 48, 0.26), 0 2px 10px rgba(140, 82, 48, 0.10);
    --text: #3b2a20;
    --text-dim: #7d6555;
    --text-faint: #a8917f;
    --field-bg: rgba(255, 255, 255, 0.86);
    --field-border: rgba(196, 158, 130, 0.38);
    --field-border-focus: #f08a3c;
    --accent: #f08a3c;
    --accent-hover: #e07c2c;
    --accent-soft: rgba(240, 138, 60, 0.16);
    --danger: #d9534f;
    --danger-soft: rgba(217, 83, 79, 0.09);
    --radius-card: 20px;
    --radius-field: 12px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* 移动端：卡片按视口收缩，绝不允许横向溢出（微信内置浏览器尤其敏感） */
  html { overflow-x: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg-fallback);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* 有背景图时铺满视口，并压一层暖白薄雾提升卡片对比度 */
  body.has-bg::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    z-index: -2;
  }
  body.has-bg::after {
    content: "";
    position: fixed;
    inset: 0;
    /* 只做轻微压暗+暖色倾向，让插画保持可见；可读性交给卡片自身的不透明度。
       曾经的教训：overlay 太厚会让整张图糊成一片白，视觉上很廉价。 */
    background: linear-gradient(115deg, rgba(255, 247, 240, .34) 0%, rgba(255, 240, 230, .20) 50%, rgba(255, 236, 224, .10) 100%);
    z-index: -1;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 408px;
    padding: 40px 36px 30px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    animation: rise .4s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  /* 卡片顶部一抹暖光，呼应插画里的日落 */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    border-radius: var(--radius-card) var(--radius-card) 0 0;
    background: linear-gradient(90deg, #ffb066, #f08a3c 45%, #e8674a);
    opacity: .85;
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand-logo {
    width: 42px; height: 42px; border-radius: 13px;
    display: grid; place-items: center; flex: none;
    background: linear-gradient(140deg, #ffa552, #f0763a);
    box-shadow: 0 6px 16px rgba(240, 118, 58, .30);
  }
  .brand-logo svg { width: 24px; height: 24px; display: block; }
  .brand-name { font-size: 16.5px; font-weight: 660; letter-spacing: .2px; }
  .brand-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; letter-spacing: .3px; }

  h1 { margin: 0 0 7px; font-size: 21.5px; font-weight: 660; letter-spacing: .2px; }
  .hint { margin: 0 0 24px; font-size: 13px; color: var(--text-dim); line-height: 1.6; }

  .field { position: relative; margin-bottom: 14px; }
  .field input {
    width: 100%;
    height: 47px;
    padding: 0 44px 0 15px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: var(--radius-field);
    outline: none;
    transition: border-color .16s, background .16s, box-shadow .16s;
  }
  .field input::placeholder { color: var(--text-faint); }
  .field input:focus {
    border-color: var(--field-border-focus);
    background: #fff;
    box-shadow: 0 0 0 3.5px var(--accent-soft);
  }
  /* 浏览器自动填充时不要变成刺眼的蓝底 */
  .field input:-webkit-autofill,
  .field input:-webkit-autofill:hover,
  .field input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text);
    -webkit-box-shadow: 0 0 0 1000px #fff8f2 inset;
    transition: background-color 9999s ease-out;
  }

  .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; display: grid; place-items: center;
    border: 0; background: none; cursor: pointer; border-radius: 8px;
    color: var(--text-faint); transition: color .16s, background .16s;
  }
  .toggle:hover { color: var(--accent); background: rgba(240, 138, 60, .09); }
  .toggle svg { width: 17px; height: 17px; }

  .row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 20px; }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); cursor: pointer; user-select: none; }
  .check input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

  button.submit {
    width: 100%; height: 47px;
    font-size: 15px; font-weight: 620; font-family: inherit;
    color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ffa152, #ef7c36);
    border: 0; border-radius: var(--radius-field);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: filter .16s, transform .1s, box-shadow .16s;
    box-shadow: 0 8px 20px rgba(240, 124, 54, .28);
  }
  button.submit:hover:not(:disabled) { filter: brightness(1.05); }
  button.submit:active:not(:disabled) { transform: translateY(1px); }
  button.submit:disabled { opacity: .62; cursor: not-allowed; box-shadow: none; }

  .spinner {
    width: 15px; height: 15px; flex: none;
    border: 2px solid rgba(255,255,255,.42);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  button.submit.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    display: none;
    margin-bottom: 14px;
    padding: 11px 13px;
    font-size: 13px; line-height: 1.5;
    color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid rgba(217, 83, 79, .22);
    border-radius: 10px;
    animation: shake .3s;
  }
  .error.show { display: block; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .foot { margin-top: 22px; text-align: center; font-size: 11.5px; color: var(--text-faint); line-height: 1.7; }

  /* 首次设置密码时的额外面板 */
  .setup { display: none; }
  .setup.show { display: block; }
  .setup .rule { font-size: 12px; color: var(--text-faint); margin: -6px 0 16px; }

  @media (max-width: 420px) {
    body { padding: 16px; }
    .card { padding: 30px 22px 24px; border-radius: 18px; }
    h1 { font-size: 19.5px; }
    .foot { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .spinner { animation: none; }
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <!-- 狐狸头像：呼应「狐分身」品牌与登录背景插画 -->
        <svg viewBox="0 0 24 24" fill="#fff">
          <path d="M4 3.2l3.1 3.4h9.8L20 3.2v5.9c0 3.9-3.6 7.5-8 7.5S4 13 4 9.1V3.2z"/>
          <path d="M9.5 9.6a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm5 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" fill="#f0763a"/>
          <path d="M12 12.6c-.9 0-1.6.5-1.6.5s.7.9 1.6.9 1.6-.9 1.6-.9-.7-.5-1.6-.5z" fill="#f0763a"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">狐分身 · DSH 工作台</div>
        <div class="brand-sub">DeepSeek Harness Workspace</div>
      </div>
    </div>

    <!-- 登录 -->
    <div id="login-panel">
      <h1>欢迎回来</h1>
      <p class="hint">请输入工作台访问密码以继续</p>

      <div class="error" id="err" role="alert"></div>

      <form id="form" autocomplete="on" novalidate>
        <div class="field">
          <input id="pw" type="password" name="password" placeholder="访问密码"
                 autocomplete="current-password" spellcheck="false" required>
          <button class="toggle" type="button" id="toggle" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember" checked>
            <span>记住我（30 天）</span>
          </label>
        </div>

        <button class="submit" type="submit" id="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submit-text">进入工作台</span>
        </button>
      </form>

      <p class="foot">在「狐分身」小程序 → 工具 → ⚙️ →「WebUI 公网访问」中设置或修改密码</p>
    </div>

    <!-- 首次设置密码（未配置密码时展示） -->
    <div id="setup-panel" class="setup">
      <h1>设置访问密码</h1>
      <p class="hint">该工作台尚未设置访问密码，请先创建一个</p>

      <div class="error" id="err2" role="alert"></div>

      <form id="form2" novalidate>
        <div class="field">
          <input id="pw1" type="password" placeholder="新密码（8-64 个字符）"
                 autocomplete="new-password" spellcheck="false" required>
        </div>
        <div class="field">
          <input id="pw2" type="password" placeholder="再次输入以确认"
                 autocomplete="new-password" spellcheck="false" required>
        </div>
        <p class="rule">至少 8 位，不含换行符</p>
        <button class="submit" type="submit" id="submit2">
          <span class="spinner" aria-hidden="true"></span>
          <span>设置并进入</span>
        </button>
      </form>
    </div>
  </main>

<script>
(function () {
  'use strict';

  var LOGIN_URL  = '/_eftik/login';
  var STATE_URL  = '/_eftik/session';

  var loginPanel = document.getElementById('login-panel');
  var setupPanel = document.getElementById('setup-panel');
  var errEl = document.getElementById('err');
  var errEl2 = document.getElementById('err2');
  var form = document.getElementById('form');
  var form2 = document.getElementById('form2');
  var pw = document.getElementById('pw');
  var submit = document.getElementById('submit');
  var submitText = document.getElementById('submit-text');
  var submit2 = document.getElementById('submit2');

  /* ---- 显示/隐藏密码 ---- */
  document.getElementById('toggle').addEventListener('click', function () {
    var showing = pw.type === 'text';
    pw.type = showing ? 'password' : 'text';
    this.style.color = showing ? '' : 'var(--accent)';
    pw.focus();
  });

  /* ---- 工具 ---- */
  function showError(el, msg) {
    el.textContent = msg;
    el.classList.add('show');
    // 重新触发抖动动画
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }
  function clearError(el) { el.textContent = ''; el.classList.remove('show'); }

  function busy(btn, on, text) {
    btn.classList.toggle('loading', on);
    btn.disabled = on;
    if (text && submitText) submitText.textContent = text;
  }

  function post(url, payload) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(payload || {}),
    }).then(function (r) {
      return r.text().then(function (t) {
        var data;
        try { data = JSON.parse(t); } catch (e) { data = {}; }
        return { ok: r.ok, status: r.status, data: data };
      });
    });
  }

  /* ---- 启动：先问服务端是否已配置密码 ---- */
  fetch(STATE_URL, { credentials: 'same-origin' })
    .then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (s) {
      if (s && s.configured === false) {
        // 未设置密码 → 引导创建
        loginPanel.style.display = 'none';
        setupPanel.classList.add('show');
        document.getElementById('pw1').focus();
        return;
      }
      pw.focus();
    })
    .catch(function () { pw.focus(); });

  /* ---- 登录 ---- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError(errEl);

    var value = pw.value;
    if (!value) { showError(errEl, '请输入访问密码'); pw.focus(); return; }

    var remember = document.getElementById('remember').checked;
    busy(submit, true, '验证中…');

    post(LOGIN_URL, { password: value, remember: remember })
      .then(function (res) {
        if (res.ok) {
          busy(submit, true, '正在进入…');
          location.replace('/');
          return;
        }
        // 密码错误 / 未设置 / 请求过于频繁
        busy(submit, false, '进入工作台');
        var msg = (res.data && res.data.error) || '密码不正确，请重试';
        if (res.status === 429) msg = '尝试过于频繁，请稍后再试';
        showError(errEl, msg);
        pw.select();
        pw.focus();
      })
      .catch(function () {
        busy(submit, false, '进入工作台');
        showError(errEl, '无法连接到工作台，请检查网络后重试');
      });
  });

  /* ---- 首次设置密码 ---- */
  form2.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError(errEl2);

    var a = document.getElementById('pw1').value;
    var b = document.getElementById('pw2').value;
    if (a.length < 8 || a.length > 64) { showError(errEl2, '密码长度需为 8-64 个字符'); return; }
    if (a !== b) { showError(errEl2, '两次输入的密码不一致'); return; }

    busy(submit2, true);
    post('/_eftik/setup', { password: a })
      .then(function (res) {
        if (res.ok) { location.replace('/'); return; }
        busy(submit2, false);
        showError(errEl2, (res.data && res.data.error) || '设置失败，请重试');
      })
      .catch(function () {
        busy(submit2, false);
        showError(errEl2, '无法连接到工作台，请稍后重试');
      });
  });
})();
</script>
</body>
</html>
